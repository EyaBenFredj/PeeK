async function gemini(input,json){const contents=(Array.isArray(input)?input:[{role:'user',content:input}]).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GK.model)}:generateContent?key=${encodeURIComponent(GK.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents,generationConfig:json?{responseMimeType:'application/json'}:{}})});
 const d=await r.json();if(!r.ok)throw {message:d.error?.message||('HTTP '+r.status),code:r.status===429?'rate_limited':''};return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text).join('')}

 try{if(!AI){el.textContent='Thinking…';let input=prompt;

   let t=await gemini(input,opt.json);if(opt.json){t=t.replace(/^```(json)?|```$/g,'').trim();return JSON.parse(t)}el.textContent=t;return t}
  if(opt.json){el.textContent='Thinking…';return await AI.json(prompt)}const r=await AI(prompt,{onText:({text})=>{el.textContent=text},...(opt.tools?{tools:opt.tools}:{})});el.textContent=r.text;return r.text}
 catch(e){el.textContent=e.code==='rate_limited'?'Rate limited. Wait a minute and try again.':e.code==='not_granted'?'AI access was not granted.':'AI error: '+(e.message||e);return null}}

 if(t.dataset.mv){setPL(t.dataset.mv,t.value);route();return}
 if(t.id==='imp'&&t.files[0]){t.files[0].text().then(s=>{try{const a=JSON.parse(s);const arr=(Array.isArray(a)?a:a.products||[]).map(x=>normalize({source:'collector',...x}));addImported(arr);toast(arr.length+' products imported and judged');route()}catch(err){toast('Invalid JSON file')}})}});
document.addEventListener('dragstart',e=>{const d=e.target.closest?.('[data-drag]');if(d)e.dataTransfer.setData('text/plain',d.dataset.drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('[data-col]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest?.('[data-col]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-col]');if(c){e.preventDefault();setPL(e.dataTransfer.getData('text/plain'),c.dataset.col);route()}});
function normalize(x){const legacy={US:x.trend?.us,UK:x.trend?.us,DE:x.trend?.eu,FR:x.trend?.eu,ES:x.trend?.eu,IT:x.trend?.eu,CN:x.trend?.cn};
 const origin=MC[x.origin]?x.origin:'US',mom=x.momentum??x.usG??.4,gen=genTrend(origin,mom<-.1?'d':mom>.6?'r':mom>.2?'r':'e',mom>.6?9:6,Math.floor(Math.random()*1e4)),trend={};
 MK.forEach(([c])=>{const a=x.trend?.[c]||legacy[c];trend[c]=Array.isArray(a)&&a.length>=8?a.map(Number):gen[c]});
 return mk({id:x.id||'i'+Math.random().toString(36).slice(2,9),name:x.name||'Unnamed',cat:x.cat||'Other',icon:x.icon||'📦',cost:+x.cost||5,ship:+x.ship||3,kg:+x.kg||.5,tnd:+x.tnd||79,ads:+(x.ads??0),adDays:+(x.adDays??0),stores:+(x.stores??50),tnSellers:+(x.tnSellers??0),fragile:!!x.fragile,restricted:!!x.restricted,seasons:Array.isArray(x.seasons)&&x.seasons.length&&x.seasons.length<12?x.seasons:0,origin,trend,hooks:x.hooks||[],source:x.source||'import',query:x.query||'',image:x.image||'',sources:x.sources||[],adSamples:x.adSamples||x.ad_samples||[],firstSeen:x.firstSeen||x.first_seen||today(),lastSeen:x.lastSeen||x.last_seen||'',runs:+(x.runs||0)})}
function addImported(arr){DB=DB.concat(arr);try{const cur=JSON.parse(localStorage.getItem('pk_import')||'[]');localStorage.setItem('pk_import',JSON.stringify(cur.concat(arr.map(({_m,suppliers,...p})=>p))))}catch(e){}}
route();
fetch('products.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(a=>{const arr=(Array.isArray(a)?a:a?.products||[]);if(!arr.length)return;
 DB=DB.filter(p=>p.source!=='demo').concat(arr.map(x=>normalize({source:'collector',...x})));LIVE=arr.length;UPD=(a&&!Array.isArray(a)&&a.updated)||'';resetM();route();toast(arr.length+' live products loaded')}).catch(()=>{});
